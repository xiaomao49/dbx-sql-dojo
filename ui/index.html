<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL 练习场</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>SQL 练习场</h1>
        </div>
        <div class="filters" role="group" aria-label="难度筛选">
          <button data-f="all" class="active" type="button">全部</button>
          <button data-f="Easy" type="button">简单</button>
          <button data-f="Medium" type="button">中等</button>
          <button data-f="Hard" type="button">困难</button>
        </div>
        <select id="custom-bank" class="bank-select" aria-label="自定义题库集">
          <option value="">自定义（全部）</option>
        </select>
        <button class="btn sm ghost" id="reset-progress" type="button">重置进度</button>
        <div class="spacer"></div>
        <div class="progress" id="progress"></div>
        <div class="engine" id="engine"></div>
        <button class="btn sm" id="bank-btn" type="button">题库管理</button>
      </header>
      <div class="body">
        <aside id="list"></aside>
        <main id="detail"></main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
